services:
  mongo:
    image: mongo
    container_name: mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build: ./server
    container_name: server
    restart: unless-stopped
    working_dir: /app
    ports:
      - '5000:5000'
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - ./server/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/pizza-db
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - '5173:5173'
    stdin_open: true
    tty: true
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    depends_on:
      - server
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo-data:
  server-node-modules:
  client-node-modules:

